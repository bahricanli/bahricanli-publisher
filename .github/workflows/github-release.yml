name: Publish GitHub Release

'on':
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: github-release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check whether the release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view -- "${RELEASE_TAG}" >/dev/null 2>&1; then
            printf 'A release already exists for %s.\n' "${RELEASE_TAG}"
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the release tag
        if: steps.existing.outputs.found != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Package the installable plugin
        if: steps.existing.outputs.found != 'true'
        shell: bash
        run: |
          plugin_files=(bahricanli-publisher.php readme.txt languages)
          if git cat-file -e HEAD:LICENSE; then
            plugin_files+=(LICENSE)
          fi
          git archive --format=zip --prefix=bahricanli-publisher/ \
            --output=bahricanli-publisher.zip HEAD -- "${plugin_files[@]}"

      - name: Sign the ZIP build provenance with Sigstore
        if: steps.existing.outputs.found != 'true'
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bahricanli-publisher.zip

      - name: Publish the ZIP and signed provenance
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        shell: bash
        run: |
          cp -- "$ATTESTATION_BUNDLE" bahricanli-publisher.zip.sigstore.json
          release_flags=(--verify-tag --generate-notes --title "${RELEASE_TAG}")
          if [[ "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${release_flags[@]}" -- "${RELEASE_TAG}" \
            bahricanli-publisher.zip bahricanli-publisher.zip.sigstore.json
